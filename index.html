<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="spending-chart.css">
</head>

<body>
    <main>
        <header>
            <button id="openForm">+</button>
        </header>
        <div class="card-container">

            <div class="card" id="spend">
                <div class="card-head">
                    <h2 class="card-header"> Total Spend</h2>
                    <div class="stock-change" id="spendingChange">
                        <span id="changeIcon"></span>
                        <span id="changePercentage">0%</span>
                        <div class="tooltip" id="spendingTooltip">
                            Your expenses increased by 25% compared to last month.
                        </div>
                    </div>
                </div>
                <div class="amount-container">
                    <h1 class="rupee-symbol">&#8377</h2>
                        <h1 id="amount-spend">0</h1>
                </div>
            </div>

            <div class="card" id="earn">
                <div class="card-head">
                    <h2 class="card-header">Total Earn</h2>
                    <div class="stock-change" id="earningChange">
                        <span id="earningIcon"></span>
                        <span id="earningPercentage">0%</span>
                        <div class="tooltip" id="earningTooltip">
                            Your income increased by 25% compared to last month.
                        </div>
                    </div>
                </div>
                <div class="amount-container">
                    <h1 class="rupee-symbol">&#8377</h2>
                        <h1 id="amount-earn">0</h1>
                </div>
            </div>

            <div class="card" id="balance">
                <h2 class="card-header">Balance</h2>
                <div class="amount-container">
                    <h1 class="rupee-symbol">&#8377</h2>
                        <h1 id="amount-balance">0</h1>
                </div>
            </div>

        </div>

        <div class="charts">
            <div class="chart-card">
                <canvas id="expenseChart"></canvas>
            </div>
            <div class="chart-card ">
                <canvas id="incomeChart"></canvas>
            </div>
            <!-- Annual spending chart -->
            <div id="spending-chart"></div>
        </div>

        <!-- Annual spending chart -->
        <div id="spending-chart"></div>

        <div class="modal-overlay" id="modal">
            <div class="form-container">
                <button id="closeForm" class="close-btn" type="button">&times;</button>
                <form action="">
                    <div class="type-options">
                        <label>
                            <input type="radio" value="expense" name="expenseOrIncome">
                            Expense
                        </label>
                        <label for="income">
                            <input type="radio" value="income" name="expenseOrIncome">
                            Income
                        </label>
                    </div>
                    <div class="dynamicFields"></div>
                    <div class="button-container">
                        <button type="submit" id="addBtn">+Add</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- <div class="recent-transactions">
            <h3>Recent Transactions</h3>
            <div class="transaction-list"></div>
        </div> -->

    </main>


    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="script.js"></script>
    <script src="spending-chart.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
